<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <!-- Subventana / Componente Modular de Gráfica de Precios Normalizados -->
    <div id="#{empty chartId ? 'reusableNormalizedChart' : chartId}Widget" 
         class="aether-subwindow-card"
         style="background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04); overflow: hidden; margin-bottom: 8px; display: flex; flex-direction: column;">

        <!-- Cabecera de la Subventana (Condicional según showCardHeader) -->
        <h:panelGroup layout="block" rendered="#{empty showCardHeader ? true : showCardHeader}"
                      style="display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%); border-bottom: 1px solid #e2e8f0; border-top: 3px solid #0284c7;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 30px; height: 30px; border-radius: 8px; background: #e0f2fe; display: flex; align-items: center; justify-content: center; color: #0284c7;">
                    <i class="pi pi-chart-line" style="font-size: 1.10rem;"></i>
                </div>
                <div>
                    <span style="font-weight: 800; color: #0f172a; font-size: 1.02rem; display: block; line-height: 1.2;">
                        #{empty title ? 'Gráfica de Precios Normalizados' : title}
                    </span>
                    <span style="font-size: 0.78rem; color: #64748b; font-weight: 600;">
                        #{empty subtitle ? 'Pares Normalizados | Cruces RIDE ±1σ y Entradas de Trades' : subtitle}
                    </span>
                </div>
            </div>

            <!-- Controles y Fechas a la derecha -->
            <div style="display: flex; align-items: center; gap: 10px;">
                <!-- Fechas (Condicional según showDates) -->
                <h:panelGroup layout="block" rendered="#{empty showDates ? true : showDates}"
                              style="display: flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px 10px;">
                    <i class="pi pi-calendar" style="color: #0284c7; font-size: 1.25rem;"></i>
                    <span style="font-size: 0.82rem; font-weight: 700; color: #334155;">
                        #{dashboardBean.signalBtStartDate} al #{dashboardBean.signalBtEndDate}
                    </span>
                    <span style="font-size: 1.25rem; color: #64748b; font-weight: 600;">
                        (#{dashboardBean.signalBtTotalBars} velas)
                    </span>
                </h:panelGroup>

                <!-- Barra de herramientas / Controles (Condicional según showControls) -->
                <h:panelGroup layout="block" rendered="#{empty showControls ? true : showControls}"
                              style="display: flex; align-items: center; gap: 6px;">
                    <button type="button" class="aether-btn-subwindow" 
                            onclick="if(typeof resetChartZoom==='function') resetChartZoom('#{empty chartId ? 'signalBtNormalizedChart' : chartId}');"
                            style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-size: 0.80rem; font-weight: 700; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;"
                            title="Restablecer Zoom y Paneo">
                        <i class="pi pi-refresh" style="font-size: 1.25rem;"></i> Reset Zoom
                    </button>
                    <!-- Botón para expandir como subventana modal independiente -->
                    <h:panelGroup rendered="#{empty isDialog ? true : !isDialog}">
                        <button type="button" class="aether-btn-subwindow"
                                onclick="PF('dlgGraficaNormalizada').show(); setTimeout(function(){ if(typeof renderReusableNormalizedChart==='function') renderReusableNormalizedChart({canvasId: 'dialogNormalizedChart', dataInputId: '#{empty dataInputId ? 'signalBtHistoryJsonData' : dataInputId}', tradesInputId: '#{empty tradesInputId ? 'signalBtTradesJsonData' : tradesInputId}', title: '#{empty title ? 'Precios Normalizados' : title}'}); }, 150);"
                                style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-size: 0.80rem; font-weight: 700; color: #0284c7; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;"
                                title="Abrir en Subventana Flotante / Modal">
                            <i class="pi pi-window-maximize" style="font-size: 1.25rem;"></i> Subventana
                        </button>
                    </h:panelGroup>
                </h:panelGroup>
            </div>
        </h:panelGroup>

        <!-- Contenedor del Canvas de la Gráfica -->
        <div id="#{empty chartId ? 'reusableNormalizedChart' : chartId}Container" 
             style="position: relative; width: 100%; height: #{empty chartHeight ? '520px' : chartHeight}; padding: 8px 12px; box-sizing: border-box; background: #ffffff;">
            <canvas id="#{empty chartId ? 'reusableNormalizedChart' : chartId}"></canvas>
        </div>
    </div>

</ui:composition>
